<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneyCoach MA - Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-container">
    <div class="login-card">
      <header class="card-header">
        <h1>MoneyCoach MA</h1>
        <p>Connecte-toi à ton coach financier</p>
      </header>
      <form class="login-form" aria-label="login form">
        <label for="email">Email
          <input id="email" type="email" placeholder="Email" aria-label="Email" required>
        </label>
        <label for="password">Mot de passe
          <input id="password" type="password" placeholder="Mot de passe" aria-label="Mot de passe" required>
        </label>
        <button type="submit" class="submit-btn" aria-label="Se connecter">Se connecter</button>
      </form>
      <footer class="card-footer">
        <a href="#" class="link">Mot de passe oublié ?</a>
        <span class="divider" aria-hidden="true"></span>
        <a href="#" class="link">Pas encore inscrit ? Crée un compte</a>
      </footer>
    </div>
  </main>
</body>
</html>
