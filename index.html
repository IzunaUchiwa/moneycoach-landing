<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneyCoach MA - Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <div class="login-card">
      <header class="card-header">
        <h1>MoneyCoach MA</h1>
        <p>Connecte-toi à ton coach financier</p>
      </header>
      <form id="login-form" class="login-form" aria-label="login form" novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="Email" aria-label="Email" aria-describedby="email-desc" required pattern="[^@\s]+@[^@\s]+\.[^@\s]+">
          <small id="email-desc" class="visually-hidden">Entrez un email valide</small>
        </div>
        <div class="form-field">
          <label for="password">Mot de passe</label>
          <div class="password-field">
            <input id="password" type="password" placeholder="Mot de passe" aria-label="Mot de passe" aria-describedby="password-desc" required minlength="8">
            <button type="button" class="toggle-pass" aria-label="Afficher le mot de passe">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <small id="password-desc" class="visually-hidden">Au moins 8 caractères</small>
        </div>
        <button id="submit-btn" type="submit" class="submit-btn" disabled aria-label="Se connecter">Se connecter</button>
      </form>
      <div class="social-login">
        <button class="social-btn google-btn" type="button" aria-label="Continue with Google">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21.35 11.1h-9.17v2.98h5.57c-.24 1.3-.96 2.4-2.04 3.14v2.6h3.3c1.93-1.78 3.04-4.4 3.04-7.44 0-.7-.06-1.38-.2-2.03z" fill="#4285F4"/>
            <path d="M12.18 22c2.76 0 5.08-.92 6.77-2.49l-3.3-2.6c-.92.62-2.1.98-3.47.98-2.66 0-4.91-1.8-5.72-4.2H3.03v2.64A9.81 9.81 0 0012.18 22z" fill="#34A853"/>
            <path d="M6.46 13.69a5.92 5.92 0 010-3.38V7.67H3.03a9.82 9.82 0 000 8.66l3.43-2.64z" fill="#FBBC05"/>
            <path d="M12.18 5.3c1.5 0 2.85.52 3.91 1.55l2.93-2.93A9.78 9.78 0 0012.18 2 9.81 9.81 0 003.03 7.67l3.43 2.64c.81-2.4 3.06-4.2 5.72-4.2z" fill="#EA4335"/>
          </svg>
          <span>Continue with Google</span>
        </button>
        <button class="social-btn github-btn" type="button" aria-label="Continue with GitHub">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.166 6.84 9.49.5.09.68-.216.68-.48 0-.237-.01-.868-.014-1.703-2.782.603-3.37-1.343-3.37-1.343-.454-1.153-1.11-1.46-1.11-1.46-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.893 1.53 2.341 1.088 2.91.833.09-.647.35-1.088.636-1.338-2.22-.252-4.555-1.112-4.555-4.951 0-1.094.39-1.987 1.029-2.687-.103-.253-.446-1.27.098-2.646 0 0 .84-.269 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.505.337 1.909-1.295 2.748-1.026 2.748-1.026.546 1.376.202 2.393.1 2.646.64.7 1.028 1.593 1.028 2.687 0 3.848-2.338 4.695-4.566 4.943.36.31.68.925.68 1.864 0 1.345-.012 2.43-.012 2.76 0 .268.18.575.688.477A10.01 10.01 0 0022 12c0-5.52-4.48-10-10-10z"/>
          </svg>
          <span>Continue with GitHub</span>
        </button>
      </div>
      <footer class="card-footer">
        <a href="#forgot" class="link">Mot de passe oublié ?</a>
        <span class="divider" aria-hidden="true"></span>
        <a href="/auth/register" class="link">Créer un compte</a>
      </footer>
    </div>
  </main>
  <div id="alert" class="alert" role="alert" hidden></div>
</body>
</html>
