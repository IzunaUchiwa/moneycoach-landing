# Docker Compose for local services
version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moneycoachma
    volumes:
      - ./data:/var/lib/postgresql/data
  api:
    build: ../api
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/moneycoachma
    ports:
      - '3000:3000'
  web:
    build: ../web
    depends_on:
      - api
    ports:
      - '5173:80'
